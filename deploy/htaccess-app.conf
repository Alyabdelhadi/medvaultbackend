# BEGIN MedVault Laravel
# Paste ABOVE the "# BEGIN WordPress" block in public_html/app/.htaccess.
# Routes the app's API, the photo upload and the admin to Laravel
# (public_html/app/medvault.php). WordPress keeps everything else.
<IfModule mod_rewrite.c>
RewriteEngine On
RewriteBase /app/

# Bearer tokens must survive PHP-FPM / CGI.
RewriteCond %{HTTP:Authorization} .
RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

RewriteRule ^wp-json/custom/v1(/.*)?$ medvault.php [L,QSA]
RewriteRule ^wp-json/wp/v2/media/?$ medvault.php [L,QSA]
RewriteRule ^admin(/.*)?$ medvault.php [L,QSA]
RewriteRule ^up$ medvault.php [L]
</IfModule>
# END MedVault Laravel
